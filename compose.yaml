services:
  database:
    image: postgres:18.4
    container_name: yuume-database
    environment:
      POSTGRES_DB: yuume_db
      POSTGRES_USER: yuume_api
      POSTGRES_PASSWORD: ${YUUME_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:


  